<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الهمشري - الإدارة</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #1e3a8a; text-align: center; }
        .card { background: #e0f2fe; padding: 15px; margin: 10px 0; border-radius: 8px; border-right: 5px solid #0284c7; }
        button { background: #0284c7; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="container">
        <h2>لوحة تحكم الهمشري</h2>
        <div class="card">
            <h3>مرحباً بك يا مدير</h3>
            <p>حالة العمل اليوم: منتظم ومتابعة العمال مستمرة بكفاءة عالية.</p>
        </div>
        <button onclick="alert('تم تحديث بيانات العمال بنجاح!')">تحديث بيانات العمل</button>
    </div>
</body>
</html>
